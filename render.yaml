services:
  - type: web
    name: rental-mobil
    env: php
    plan: free # Anda bisa upgrade ke starter jika traffic naik
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
    startCommand: |
      php artisan migrate --force
      heroku-php-apache2 public/
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        fromValue: ${APP_KEY} # Ambil dari dashboard Render
      - key: TZ
        value: Asia/Jakarta
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: aws-0-ap-southeast-1.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres
      - key: DB_PASSWORD
        sync: false # Jangan commit password ke GitHub, set di Dashboard
      - key: SESSION_DRIVER
        value: cookie # Lebih aman untuk stateless cloud
      - key: CACHE_STORE
        value: file
      - key: FILESYSTEM_DISK
        value: public
      - key: RAG_ENGINE_URL
        value: http://127.0.0.1:5000 # Ganti ke URL production RAG jika ada
      - key: GROQ_API_KEY
        sync: false
      - key: WA_API_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MIDTRANS_SERVER_KEY
        sync: false
